<svg width="840" height="420" viewBox="0 0 840 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39ff14" />
      <stop offset="50%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;display=swap');

      text {
        font-family: 'Fira Code', 'Courier New', monospace;
      }

      .title { font-size: 13px; fill: #6e7681; font-weight: 500; }
      .live-tag { font-size: 11px; fill: #39ff14; font-weight: 700; letter-spacing: 1px; }
      .header-name { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .header-sub { font-size: 12px; fill: #39ff14; font-weight: 500; }
      
      .label { font-size: 11.5px; fill: #39ff14; font-weight: 600; }
      .val { font-size: 11.5px; fill: #e6edf3; }
      .val-accent { font-size: 11.5px; fill: #58a6ff; font-weight: 600; }
      .val-dim { font-size: 11.5px; fill: #8b949e; }
      
      .cmd-user { font-size: 13px; fill: #39ff14; font-weight: 700; }
      .cmd-path { font-size: 13px; fill: #58a6ff; font-weight: 700; }
      .cmd-text { font-size: 13px; fill: #f0f6fc; }
      .cmd-out { font-size: 12px; fill: #7ee787; }

      .diag-box { fill: #161b22; stroke: #30363d; stroke-width: 1.2; rx: 4; }
      .diag-text { font-size: 10px; fill: #c9d1d9; font-weight: 600; text-anchor: middle; }
      .diag-line { stroke: #30363d; stroke-width: 1.5; stroke-dasharray: 3 3; }
      .diag-line-active { stroke: #39ff14; stroke-width: 1.5; }

      /* Animations */
      @keyframes pulseGlow {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.9); }
      }
      .pulsing-dot {
        animation: pulseGlow 1.8s ease-in-out infinite;
      }

      @keyframes packetMove1 {
        0% { cx: 70; cy: 155; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { cx: 135; cy: 155; opacity: 0; }
      }
      .packet1 { animation: packetMove1 2s linear infinite; }

      @keyframes packetMove2 {
        0% { cx: 185; cy: 155; opacity: 0; }
        50% { cx: 235; cy: 125; opacity: 1; }
        100% { cx: 285; cy: 125; opacity: 0; }
      }
      .packet2 { animation: packetMove2 2.4s linear infinite; }

      @keyframes packetMove3 {
        0% { cx: 185; cy: 155; opacity: 0; }
        50% { cx: 235; cy: 185; opacity: 1; }
        100% { cx: 285; cy: 185; opacity: 0; }
      }
      .packet3 { animation: packetMove3 2.4s linear infinite 0.6s; }

      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor { animation: cursorBlink 0.9s infinite; }
    </style>
  </defs>

  <!-- WINDOW CONTAINER -->
  <rect x="2" y="2" width="836" height="416" rx="12" fill="url(#bgGrad)" stroke="#1f293d" stroke-width="2" />
  
  <!-- ACCENT TOP BORDER -->
  <path d="M 2 14 Q 2 2 14 2 L 826 2 Q 838 2 838 14" fill="none" stroke="url(#emeraldGrad)" stroke-width="2.5" opacity="0.85" />

  <!-- TITLE BAR -->
  <path d="M 2 14 Q 2 2 14 2 L 826 2 Q 838 2 838 14 L 838 38 L 2 38 Z" fill="#111622" />
  <line x1="2" y1="38" x2="838" y2="38" stroke="#1f293d" stroke-width="1" />

  <!-- WINDOW BUTTONS -->
  <circle cx="22" cy="20" r="5.5" fill="#ff5f56" />
  <circle cx="40" cy="20" r="5.5" fill="#ffbd2e" />
  <circle cx="58" cy="20" r="5.5" fill="#27c93f" />

  <!-- TITLE TEXT -->
  <text x="420" y="24" text-anchor="middle" class="title">arahmane@dakar-cluster: ~/batoucloud-core (zsh)</text>

  <!-- LIVE STATUS PILL -->
  <rect x="735" y="10" width="85" height="20" rx="10" fill="#0d1e15" stroke="#1b4d2e" stroke-width="1" />
  <circle cx="748" cy="20" r="4" fill="#39ff14" filter="url(#glow)" class="pulsing-dot" />
  <text x="760" y="24" class="live-tag">ONLINE</text>

  <!-- ================= LEFT COLUMN: ARCHITECTURE TOPOLOGY ================= -->
  <g transform="translate(18, 48)">
    <rect x="0" y="0" width="310" height="260" rx="8" fill="#080c14" stroke="#1b2234" stroke-width="1" />
    <text x="14" y="24" class="label">DISTRIBUTED SYSTEM TOPOLOGY</text>
    <line x1="14" y1="32" x2="296" y2="32" stroke="#1b2234" stroke-width="1" />

    <!-- Client Node -->
    <rect x="20" y="95" width="55" height="30" class="diag-box" />
    <text x="47" y="114" class="diag-text">CLIENT</text>

    <!-- Flow line Client -> Gateway -->
    <line x1="75" y1="110" x2="115" y2="110" class="diag-line-active" />
    <circle cx="95" cy="110" r="3" fill="#39ff14" class="packet1" />

    <!-- Gateway Node -->
    <rect x="115" y="85" width="70" height="50" rx="5" fill="#13231b" stroke="#39ff14" stroke-width="1.5" />
    <text x="150" y="107" class="diag-text" fill="#39ff14">API</text>
    <text x="150" y="122" class="diag-text" fill="#39ff14">GATEWAY</text>

    <!-- Branch lines to Services -->
    <path d="M 185 100 L 220 70 L 235 70" fill="none" class="diag-line-active" />
    <path d="M 185 120 L 220 150 L 235 150" fill="none" class="diag-line-active" />
    <circle cx="210" cy="85" r="3" fill="#58a6ff" class="packet2" />
    <circle cx="210" cy="135" r="3" fill="#39ff14" class="packet3" />

    <!-- Microservice Auth -->
    <rect x="235" y="55" width="60" height="30" class="diag-box" stroke="#58a6ff" />
    <text x="265" y="74" class="diag-text" fill="#58a6ff">AUTH SVC</text>

    <!-- Microservice Core -->
    <rect x="235" y="135" width="60" height="30" class="diag-box" stroke="#39ff14" />
    <text x="265" y="154" class="diag-text" fill="#39ff14">CORE SVC</text>

    <!-- Lower queue & db row -->
    <line x1="265" y1="165" x2="265" y2="195" class="diag-line" />
    
    <!-- RabbitMQ broker -->
    <rect x="120" y="185" width="75" height="28" rx="4" fill="#20150d" stroke="#ff7b25" stroke-width="1.2" />
    <text x="157" y="203" class="diag-text" fill="#ff7b25">RABBITMQ</text>
    <path d="M 235 150 L 195 195" fill="none" class="diag-line" />

    <!-- PostgreSQL / Redis -->
    <rect x="225" y="195" width="75" height="28" rx="4" fill="#0d1b2a" stroke="#415a77" stroke-width="1.2" />
    <text x="262" y="213" class="diag-text" fill="#778da9">POSTGRES/REDIS</text>

    <!-- Telemetry bar -->
    <rect x="14" y="232" width="282" height="16" rx="4" fill="#111622" />
    <text x="22" y="244" font-size="9" fill="#8b949e">System Design: <tspan fill="#39ff14">Decoupled</tspan> | High Availability: <tspan fill="#58a6ff">99.99%</tspan></text>
  </g>

  <!-- ================= RIGHT COLUMN: SYSTEM DOSSIER ================= -->
  <g transform="translate(345, 52)">
    <text x="0" y="22" class="header-name">Abdourahmane Faye</text>
    <text x="0" y="40" class="header-sub">Computer Science Engineer (DIC2) &amp; Lead Developer</text>
    <line x1="0" y1="50" x2="475" y2="50" stroke="#21262d" stroke-width="1.2" />

    <!-- Field list -->
    <g transform="translate(0, 70)">
      <text x="0" y="0" class="label">CAMPUS</text>
      <text x="110" y="0" class="val-dim">::</text>
      <text x="125" y="0" class="val">UCAD / ESP Dakar (DIC2 Génie Info)</text>

      <text x="0" y="23" class="label">CURRENT_ROLE</text>
      <text x="110" y="23" class="val-dim">::</text>
      <text x="125" y="23" class="val">Lead Developer @ <tspan class="val-accent">BatouCloud</tspan></text>

      <text x="0" y="46" class="label">LEADERSHIP</text>
      <text x="110" y="46" class="val-dim">::</text>
      <text x="125" y="46" class="val">Président Commission IT @ <tspan class="val-accent">CEE (ESP)</tspan></text>

      <text x="0" y="69" class="label">EXPERIENCE</text>
      <text x="110" y="69" class="val-dim">::</text>
      <text x="125" y="69" class="val">Ex-Ingénieur Stagiaire @ <tspan class="val-accent">SENELEC</tspan></text>

      <text x="0" y="92" class="label">CORE_FOCUS</text>
      <text x="110" y="92" class="val-dim">::</text>
      <text x="125" y="92" class="val">System Design, Microservices &amp; Scalability</text>

      <text x="0" y="115" class="label">TECH_STACK</text>
      <text x="110" y="115" class="val-dim">::</text>
      <text x="125" y="115" class="val">FastAPI • Node.js • RabbitMQ • Docker • Redis</text>

      <text x="0" y="138" class="label">PHILOSOPHY</text>
      <text x="110" y="138" class="val-dim">::</text>
      <text x="125" y="138" class="val" font-style="italic">"Think before you code."</text>

      <text x="0" y="161" class="label">LOCATION</text>
      <text x="110" y="161" class="val-dim">::</text>
      <text x="125" y="161" class="val-accent">Dakar, Senegal 🇸🇳 ➔ Built for scale 🚀</text>
    </g>
  </g>

  <!-- ================= BOTTOM CONSOLE COMMAND ================= -->
  <g transform="translate(18, 324)">
    <rect x="0" y="0" width="804" height="78" rx="8" fill="#080c14" stroke="#1b2234" stroke-width="1" />
    
    <!-- Command Prompt -->
    <text x="16" y="28">
      <tspan class="cmd-user">arahmane@esp-cluster</tspan><tspan class="val-dim">:</tspan><tspan class="cmd-path">~/batoucloud</tspan><tspan class="val-dim">$</tspan>
      <tspan class="cmd-text"> curl -s https://api.batoucloud.dev/v1/system/status | jq .</tspan>
      <tspan class="cursor" fill="#39ff14">█</tspan>
    </text>

    <!-- Response Output -->
    <text x="16" y="54" class="cmd-out">
      { "status": "200_OK", "system_design": "optimal", "role": "Lead_Dev", "cee_it_president": true, "ready": true }
    </text>
  </g>
</svg>
